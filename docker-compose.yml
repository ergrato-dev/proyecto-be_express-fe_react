# ¿Qué? Orquesta el stack completo — db, mailpit, backend y frontend.
# ¿Para qué? `docker compose up` levanta todo el proyecto de punta a punta, sin instalar
#   Node.js ni pnpm en el host.
# ¿Impacto? Las credenciales de `db` están hardcodeadas en texto plano — correcto para
#   desarrollo local, NUNCA copiar estos valores a un entorno de producción real.
services:
  db:
    image: postgres:17-alpine
    container_name: nn_auth_db
    environment:
      POSTGRES_USER: nn_user
      POSTGRES_PASSWORD: nn_password
      POSTGRES_DB: nn_auth_db
    ports:
      - "5432:5432"
    volumes:
      - nn_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nn_user -d nn_auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nn_auth_network

  # ¿Qué? BD exclusiva para los tests del backend (puerto 5433, nombre nn_auth_test).
  # ¿Para qué? Los tests borran todas las tablas antes de cada caso: nunca deben correr
  #   sobre nn_auth_db. Se levanta sola: docker compose up -d --wait db-test
  # ¿Impacto? Sin volumen: es desechable y cada `docker compose down` la deja vacía.
  #   global-setup.ts aplica las migraciones al empezar la suite.
  db-test:
    image: postgres:17-alpine
    container_name: nn_auth_db_test
    environment:
      POSTGRES_USER: nn_user
      POSTGRES_PASSWORD: nn_password
      POSTGRES_DB: nn_auth_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nn_user -d nn_auth_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: nn_auth_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — http://localhost:8025
    restart: unless-stopped
    networks:
      - nn_auth_network

  be:
    build:
      context: ./be
    container_name: nn_auth_be
    env_file:
      - ./be/.env
    environment:
      # ¿Qué? Sobrescribe los valores de be/.env pensados para ejecución nativa (localhost).
      # ¿Para qué? Dentro de la red de Docker, los servicios se resuelven por nombre.
      DATABASE_URL: postgresql://nn_user:nn_password@db:5432/nn_auth_db
      MAIL_HOST: mailpit
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nn_auth_network

  fe:
    build:
      context: ./fe
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
    container_name: nn_auth_fe
    ports:
      - "5173:80"
    depends_on:
      - be
    networks:
      - nn_auth_network

networks:
  nn_auth_network:
    driver: bridge

volumes:
  nn_auth_data:
